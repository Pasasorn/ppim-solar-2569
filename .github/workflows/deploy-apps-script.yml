# Auto-deploy apps-script-meter.gs → Google Apps Script (New version บน deployment เดิม · URL /exec ไม่เปลี่ยน)
# ต้องตั้งค่าครั้งเดียว (ดู HANDOFF.md หัวข้อ "Auto deploy Apps Script"):
#   secrets.CLASPRC_JSON  = เนื้อหาไฟล์ ~/.clasprc.json หลังรัน `npx @google/clasp login` (Windows PowerShell: `npx.cmd @google/clasp login`) บนเครื่องตัวเอง
#   secrets.GAS_SCRIPT_ID = Script ID (Apps Script → ⚙️ Project Settings → IDs)
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: [apps-script-meter.gs]
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

env:
  # deployment เดิมที่ Dashboard เรียกใช้ (ตรงกับ URL /exec ใน index.html)
  GAS_DEPLOYMENT_ID: AKfycbxtZZeNznb3LOMF_P4YrsI7OMcd-DqbKIXrdpeiftFcy4v7s2Bnf0ks-t7U6OjVfTk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ตรวจว่าตั้ง secrets แล้ว
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          bad=0
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::ยังไม่ได้ตั้ง secret CLASPRC_JSON (Settings → Secrets and variables → Actions)"; bad=1; fi
          if [ -z "$GAS_SCRIPT_ID" ]; then echo "::error::ยังไม่ได้ตั้ง secret GAS_SCRIPT_ID — ใส่ Script ID จาก Apps Script → ⚙️ Project Settings → IDs → Script ID"; bad=1
          elif [[ "$GAS_SCRIPT_ID" == AKfycb* ]]; then echo "::error::GAS_SCRIPT_ID ขึ้นต้น AKfycb… = Deployment ID (ผิดช่อง) — ต้องใช้ Script ID จาก ⚙️ Project Settings → IDs"; bad=1
          elif ! [[ "$GAS_SCRIPT_ID" =~ ^[A-Za-z0-9_-]{40,80}$ ]]; then echo "::error::GAS_SCRIPT_ID รูปแบบไม่ถูกต้อง (ยาว ${#GAS_SCRIPT_ID} ตัว · มีช่องว่าง/อักขระแปลก?) — คัดลอก Script ID ใหม่ทั้งบรรทัด"; bad=1; fi
          exit $bad

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ตรวจ syntax .gs
        run: node -e "new Function(require('fs').readFileSync('apps-script-meter.gs','utf8'))"

      - name: ติดตั้ง clasp + credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm i -g @google/clasp@3.4.1
          # ใช้ไฟล์ตามที่วางไว้ (clasp 3.x อ่านได้ทั้งรูปแบบ {tokens:{default}} และรูปแบบเก่า {token})
          node -e '
            let j; try { j = JSON.parse(process.env.CLASPRC_JSON); } catch(e){ console.log("::error::CLASPRC_JSON ไม่ใช่ JSON ที่ถูกต้อง (คัดลอกไม่ครบ?)"); process.exit(1); }
            const t = (j.tokens && (j.tokens.default || Object.values(j.tokens)[0])) || j.token;
            console.log("keys:", Object.keys(j).join(", "), "| มี refresh_token:", !!(t && t.refresh_token), "| ความยาว refresh_token:", t && t.refresh_token ? t.refresh_token.length : 0);
            if (!t || !t.refresh_token) { console.log("::error::ไม่พบ refresh_token — รัน clasp login ใหม่แล้วคัดลอกไฟล์ .clasprc.json ทั้งไฟล์"); process.exit(1); }
            if (t.expiry_date) console.log("token ออกเมื่อประมาณ:", new Date(t.expiry_date - 3600e3).toISOString(), "(ใช้เช็กว่าเป็นไฟล์ล่าสุดหรือไม่)");
            require("fs").writeFileSync(process.env.HOME + "/.clasprc.json", JSON.stringify(j));
          '

      - name: ดึงโปรเจกต์เดิม (เก็บ appsscript.json เดิมไว้) แล้ววางโค้ดใหม่ทับ
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          mkdir gas && cd gas
          printf '{"scriptId":"%s","rootDir":"."}' "$GAS_SCRIPT_ID" > .clasp.json
          clasp pull
          ls -la
          # กันวางทับผิดโปรเจกต์: deployment ที่ Dashboard ใช้ ต้องอยู่ในโปรเจกต์นี้
          clasp list-deployments | tee ../deployments.txt
          if ! grep -q "$GAS_DEPLOYMENT_ID" ../deployments.txt; then
            echo "::error::ไม่พบ Deployment ID ของ Dashboard ($GAS_DEPLOYMENT_ID) ในโปรเจกต์นี้ — GAS_SCRIPT_ID น่าจะเป็นคนละโปรเจกต์ หยุดโดยไม่แก้อะไร"; exit 1; fi
          shopt -s nullglob
          files=( *.js *.gs )
          if [ "${#files[@]}" != "1" ]; then
            echo "::error::โปรเจกต์ Apps Script มีไฟล์โค้ด ${#files[@]} ไฟล์ (${files[*]}) (คาดว่า 1) — หยุดเพื่อไม่ให้ลบไฟล์อื่น"; exit 1; fi
          f="${files[0]}"
          echo "ไฟล์เดิม $f: $(wc -c < "$f") bytes · ไฟล์ใหม่: $(wc -c < ../apps-script-meter.gs) bytes"
          cp ../apps-script-meter.gs "$f"
          echo "วางโค้ดทับไฟล์ $f"

      - name: Push + Deploy เป็น New version (URL เดิม)
        working-directory: gas
        run: |
          clasp push --force
          clasp update-deployment "$GAS_DEPLOYMENT_ID" -d "auto ${GITHUB_SHA::7}"
          clasp list-deployments

      - name: ลบ credentials
        if: always()
        run: rm -f ~/.clasprc.json
